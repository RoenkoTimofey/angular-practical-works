<div style="padding: 20px;">
  <h2>Демонстрація директиви configurableHighlight</h2>
  
  <p configurableHighlight [highlightColor]="'cyan'">
    Цей параграф підсвічується кольором cyan при наведенні миші.
  </p>
  
  <div configurableHighlight [highlightColor]="'lightgreen'" style="padding: 15px; margin-top: 15px; border: 1px solid #ccc;">
    Цей div підсвічується кольором lightgreen при наведенні миші.
  </div>
  
  <p configurableHighlight style="padding: 10px; margin-top: 15px;">
    Цей параграф використовує значення за замовчуванням (yellow).
  </p>
</div>

<router-outlet />
